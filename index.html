<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Máy tính tiền mặt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --neg:#ff8a80; --bg:#eef1ee; --surface:#ffffff; --text:#17211b; --muted:#5d6b62; --line:#d5dcd6; --head:#17211b; --head-text:#f4f7f4;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --neg:#b3261e; --bg:#101612; --surface:#19211b; --text:#e8eee9; --muted:#9aa8a0; --line:#2b362e; --head:#e8eee9; --head-text:#101612;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --neg:#b3261e; --bg:#101612; --surface:#19211b; --text:#e8eee9; --muted:#9aa8a0; --line:#2b362e; --head:#e8eee9; --head-text:#101612;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; min-height:100%; background:var(--bg); color:var(--text);
  font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; line-height:1.5;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
main{max-width:34rem;margin:0 auto;padding:1.5rem 1rem 3rem}
h1{font-size:1.5rem;font-weight:800;margin:0 0 .25rem;letter-spacing:-.01em}
.sub{margin:0 0 1.25rem;color:var(--muted);font-size:.95rem}

.total{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:11;
  background:var(--head); color:var(--head-text);
  border-radius:.75rem; padding:.9rem 1rem; margin-bottom:1rem;
}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:.75rem;flex-wrap:wrap}
.lbl{font-size:.85rem;opacity:.8}
.sum{font-size:1.9rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15;overflow-wrap:anywhere}
.sum small{font-size:1rem;font-weight:500;margin-left:.3rem;opacity:.8}
.minus{margin-top:.4rem;padding-top:.4rem;border-top:1px solid color-mix(in srgb,currentColor 30%,transparent);font-weight:500;font-variant-numeric:tabular-nums;opacity:.85}
.rest{display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap;font-variant-numeric:tabular-nums;margin-top:.3rem}
.rest b{font-size:1.45rem;font-weight:800;overflow-wrap:anywhere}
.rest small{font-size:.9rem;opacity:.8}
.rest b.neg{color:var(--neg)}
.btns{display:flex;gap:.4rem;flex-wrap:wrap}
button.btn{
  font:inherit;font-weight:700;font-size:.9rem;cursor:pointer;
  background:transparent;color:inherit;border:1.5px solid currentColor;border-radius:.5rem;padding:.45rem .9rem;
}
button.btn:hover{background:color-mix(in srgb,currentColor 14%,transparent)}
button.btn[aria-expanded="true"]{background:var(--head-text);color:var(--head);border-color:var(--head-text)}
button:focus-visible,input:focus-visible{outline:3px solid #3f8cff;outline-offset:2px}

.out{margin-top:.8rem}
.out .lbl{margin-bottom:.35rem}
.cells{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:.25rem}
.c{
  border-top:3px solid var(--c);background:color-mix(in srgb,currentColor 9%,transparent);
  border-radius:.3rem;padding:.2rem .1rem .3rem;text-align:center;font-variant-numeric:tabular-nums;min-width:0;
}
.c span{display:block;font-size:.68rem;opacity:.8}
.c b{display:block;font-size:1.1rem;font-weight:800;line-height:1.25;overflow-wrap:anywhere}
.c.z b{opacity:.4;font-weight:500}
.msg{margin:.6rem 0 0;font-size:.85rem;opacity:.9}
.msg:empty{display:none}

.detail{background:var(--surface);border:1px solid var(--line);border-radius:.75rem;padding:.9rem 1rem;margin-bottom:1rem}
.detail .dl{font-size:.85rem;color:var(--muted);margin:0 0 .35rem}
.detail .dl + .cells{margin-bottom:.8rem}
.detail .cells:last-child{margin-bottom:0}

.list{display:grid;gap:.6rem}
.row{
  display:grid; grid-template-columns:6.2rem 1fr; grid-template-areas:"note input" "note sub";
  background:var(--surface); border:1px solid var(--line); border-radius:.6rem; overflow:hidden;
}
.note{
  grid-area:note; background:var(--c); color:#fff;
  display:flex; flex-direction:column; justify-content:center; align-items:center; padding:.6rem .4rem;
  font-variant-numeric:tabular-nums; cursor:pointer; border-right:5px double rgb(255 255 255 / .55);
}
.note b{font-size:1.2rem;font-weight:800;line-height:1.1}
.note small{font-size:.75rem;opacity:.9}
.field{grid-area:input;display:flex;align-items:center;gap:.5rem;padding:.6rem .9rem .2rem}
.field span{color:var(--muted);font-size:.9rem}
button.x{
  font:inherit;font-size:.8rem;font-weight:700;cursor:pointer;flex:none;
  color:var(--muted);background:transparent;border:1.5px solid var(--line);border-radius:.4rem;padding:.2rem .55rem;visibility:hidden;
}
button.x.on{visibility:visible}
button.x:hover{color:var(--text);border-color:var(--c)}
input{
  width:100%; min-width:0; font:inherit; font-size:1.25rem; font-weight:700; font-variant-numeric:tabular-nums;
  color:var(--text); background:transparent; border:0; border-bottom:2px solid var(--line); padding:.2rem .1rem; border-radius:0;
}
input:focus{border-bottom-color:var(--c)}
input::placeholder{color:var(--muted);opacity:.6;font-weight:400}
.subtotal{grid-area:sub;padding:.1rem .9rem .6rem;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.95rem;overflow-wrap:anywhere}
.subtotal.on{color:var(--text);font-weight:700}
@media (min-width:520px){
  .row{grid-template-columns:7rem 1fr minmax(0,1.3fr);grid-template-areas:"note input sub";align-items:center}
  .field{padding:.8rem .9rem}
  .subtotal{padding:.8rem .9rem .8rem 0;font-size:1.05rem}
}
</style>
</head>
<body>
<main>
  <h1>Máy tính tiền mặt</h1>
  <p class="sub">Nhập số tờ ở mỗi mệnh giá. Ô để trống được tính là 0.</p>

  <section class="total" aria-live="polite">
    <div class="top">
      <div>
        <div class="lbl">Tổng cộng</div>
        <div class="sum"><span id="total">0</span><small>VNĐ</small></div>
        <div class="minus" id="minus" hidden>-1.500.000 VNĐ</div>
        <div class="rest"><span class="lbl">Còn lại</span><b id="rest">-1.500.000</b><small>VNĐ</small></div>
      </div>
      <div class="btns">
        <button class="btn" id="detailBtn" type="button" aria-expanded="false" aria-controls="detail">Chi tiết</button>
        <button class="btn" id="clear" type="button">Xóa tất cả</button>
      </div>
    </div>
    <div class="out">
      <div class="lbl">Số tờ cần lấy ra (x − y)</div>
      <div class="cells" id="outRow"></div>
    </div>
    <p class="msg" id="msg"></p>
  </section>

  <section class="detail" id="detail" hidden>
    <p class="dl">Số tờ đã nhập (x)</p>
    <div class="cells" id="xRow"></div>
    <p class="dl">Số tờ còn lại (y), tổng đúng 1.500.000 VNĐ</p>
    <div class="cells" id="yRow"></div>
  </section>

  <div class="list" id="list"></div>
</main>

<script>
var DENOMS = [
  [500000,"#1f6f9a"],[200000,"#a8412f"],[100000,"#3b8a4d"],
  [50000,"#b8467c"],[20000,"#3a5fb0"],[10000,"#7d6a22"],
  [5000,"#23838f"],[2000,"#66786a"],[1000,"#86608a"]
];
var U = [500,200,100,50,20,10,5,2,1], GOAL = 1500;
function fmt(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,"."); }
function $(id){ return document.getElementById(id); }

// y = làm tròn(k × x), k = 1.500.000 ÷ tổng đã nhập, rồi điều chỉnh bằng quy hoạch động
// để tổng y đúng 1.500.000 VNĐ và y ≤ x ở mọi mệnh giá (đơn vị tính: nghìn VNĐ)
function solve(c){
  var total = 0; c.forEach(function(n,i){ total += n*U[i]; });
  if (total < GOAL) return null;
  var k = GOAL/total, n = 9, INF = 1e18, cost = new Float64Array(GOAL+1).fill(INF), ch = [], i;
  cost[0] = 0;
  for (i = 0; i < n; i++){
    var t = k*c[i], kmax = Math.min(c[i], Math.floor(GOAL/U[i]));
    var nc = new Float64Array(GOAL+1).fill(INF), pk = new Int16Array(GOAL+1);
    for (var a = 0; a <= GOAL; a++){
      if (cost[a] >= INF) continue;
      for (var y = 0; y <= kmax; y++){
        var b = a+y*U[i]; if (b > GOAL) break;
        var cc = cost[a]+(y-t)*(y-t);
        if (cc < nc[b]){ nc[b] = cc; pk[b] = y; }
      }
    }
    cost = nc; ch.push(pk);
  }
  var e = GOAL; while (e > 0 && cost[e] >= INF) e--;
  var res = [];
  for (i = n-1; i >= 0; i--){ res[i] = ch[i][e]; e -= res[i]*U[i]; }
  return {y: res};
}

function cells(vals){
  return DENOMS.map(function(d,i){
    return '<div class="c'+(vals[i] ? '' : ' z')+'" style="--c:'+d[1]+'"><span>'+(d[0]/1000)+'k</span><b>'+fmt(vals[i])+'</b></div>';
  }).join('');
}

var list = $('list'), inputs = [];
DENOMS.forEach(function(d){
  var row = document.createElement('div');
  row.className = 'row';
  row.style.setProperty('--c', d[1]);
  row.innerHTML =
    '<label class="note" for="n'+d[0]+'"><b>'+fmt(d[0])+'</b><small>VNĐ</small></label>'+
    '<div class="field"><input id="n'+d[0]+'" type="text" inputmode="numeric" autocomplete="off" placeholder="0" aria-label="Số tờ '+fmt(d[0])+' VNĐ"><span>tờ</span><button type="button" class="x" aria-label="Xóa số tờ '+fmt(d[0])+' VNĐ">Xóa</button></div>'+
    '<div class="subtotal">0 VNĐ</div>';
  list.appendChild(row);
  var input = row.querySelector('input'), btn = row.querySelector('.x');
  input.addEventListener('input', function(){
    var v = input.value.replace(/\D/g,'').slice(0,9).replace(/^0+(?=\d)/,'');
    if (input.value !== v) input.value = v;
    update();
  });
  btn.addEventListener('click', function(){ input.value = ''; update(); input.focus(); });
  inputs.push([d[0], input, row.querySelector('.subtotal'), btn]);
});

function update(){
  var c = [], total = 0;
  inputs.forEach(function(x){
    var n = parseInt(x[1].value, 10) || 0, sub = n*x[0];
    c.push(n); total += sub;
    x[2].textContent = fmt(sub)+' VNĐ';
    x[2].classList.toggle('on', sub > 0);
    x[3].classList.toggle('on', x[1].value !== '');
  });
  var rest = total-1500000;
  $('total').textContent = fmt(total);
  $('rest').textContent = fmt(rest);
  $('rest').classList.toggle('neg', rest < 0);

  var s = solve(c), y = s ? s.y : c.slice();
  var z = c.map(function(n,i){ return n-y[i]; });
  var used = 0; y.forEach(function(v,i){ used += v*U[i]; });
  $('outRow').innerHTML = cells(z);
  $('xRow').innerHTML = cells(c);
  $('yRow').innerHTML = cells(y);
  $('msg').textContent = !s
    ? (total ? 'Tổng chưa đủ 1.500.000 VNĐ nên chưa có tờ cần lấy ra.' : '')
    : (used < GOAL ? 'Không ghép đúng 1.500.000 VNĐ được từ các tờ đã nhập, thiếu '+fmt((GOAL-used)*1000)+' VNĐ.' : '');
}

$('detailBtn').addEventListener('click', function(){
  var open = $('detail').hidden;
  $('detail').hidden = !open;
  $('minus').hidden = !open;
  this.setAttribute('aria-expanded', open ? 'true' : 'false');
});
$('clear').addEventListener('click', function(){
  inputs.forEach(function(x){ x[1].value = ''; });
  update();
  inputs[0][1].focus();
});
update();
</script>
</body>
</html>
